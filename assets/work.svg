<svg xmlns="http://www.w3.org/2000/svg" width="840" height="84" viewBox="0 0 840 84" role="img"><style>@font-face{font-family:SG;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JB;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
*{box-sizing:border-box;margin:0;padding:0}
.root{font-family:IN,sans-serif;color:#e6edf3;-webkit-font-smoothing:antialiased}
.sg{font-family:SG}.jb{font-family:JB}.ar{font-family:AR;font-weight:600}
.card{background:#111722;border:1px solid #262c38;border-radius:20px;overflow:hidden}
.label{font-family:JB;font-weight:400;font-size:11px;letter-spacing:.14em;color:#6e7681}
.muted{color:#a5adbb}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes flow{to{stroke-dashoffset:-40}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
.rise{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}

.wh{display:flex;justify-content:space-between;align-items:center;width:840px;height:84px;padding:0 26px;border-radius:18px;border:1px solid #262c38;background:linear-gradient(90deg,#151026,#0b0f16 70%)}
.wt{font-size:30px;font-weight:700;letter-spacing:-.02em;color:#f0f6fc;margin-top:6px}
.wn{font-size:11px;color:#6e7681}
</style><foreignObject x="0" y="0" width="840" height="84"><div xmlns="http://www.w3.org/1999/xhtml" class="root" style="width:840px;height:84px">
<div class="wh">
  <div>
    <div class="label">04 · SELECTED WORK</div>
    <div class="sg wt">Things I've built</div>
  </div>
  <div class="jb wn">each card opens its repo ↗</div>
</div>
</div></foreignObject></svg>